<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Quiz Interactif</title>
    <link rel="stylesheet" href="style.css">
    <script src="quiz.js" defer></script>
</head>
<body>

    <div class="quiz-container">
        <div id="question-container">
            <h2 id="question">La question s'affichera ici</h2>
            <div id="answer-buttons" class="btn-grid">
                </div>
        </div>
        <div class="controls">
            <button id="next-btn" class="next-btn hide">Question suivante</button>
        </div>
        <div id="score-container" class="hide">
            <h2>Quiz terminé !</h2>
            <p id="score-text"></p>
        </div>
    </div>

    
</body>
</html>
